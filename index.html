<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PassGen</title>
<meta name="description" content="Simple secure password generator">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<style>
:root{
  --bg:#ffffff; --surface:#f5f5f5; --text:#111111; --muted:#6b6b6b;
  --border:#e5e5e5; --accent:#111111; --on-accent:#ffffff;
  --good:#16a34a; --ok:#d97706; --weak:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0d0d; --surface:#1a1a1a; --text:#f5f5f5; --muted:#a3a3a3;
    --border:#2a2a2a; --accent:#f5f5f5; --on-accent:#111111;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
}
header{
  display:flex; align-items:center; gap:10px;
  padding:16px 20px; border-bottom:1px solid var(--border);
}
header svg{width:26px; height:26px;}
header h1{font-size:20px; margin:0; font-weight:700; letter-spacing:.3px;}
main{flex:1; width:100%; max-width:520px; margin:0 auto; padding:20px 16px 32px;}
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:20px; margin-bottom:16px;
}
.output-row{display:flex; align-items:stretch;}
.gen-card h2{font-size:23px; margin:0; font-weight:800; display:flex; align-items:center; gap:10px;}
.gen-label{font-size:16px; font-weight:700; margin:20px 0 8px;}
#pwd{
  flex:1; min-width:0; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:20px; font-weight:700; word-break:break-all; line-height:1.5;
  background:var(--bg); border:1px solid var(--border); border-right:none; border-radius:12px 0 0 12px;
  padding:14px 12px; color:#d92b2b; cursor:pointer;
}
#refresh{
  flex:0 0 auto; border:none; border-radius:0 12px 12px 0;
  background:#6b7280; color:#fff; font-size:16px; font-weight:600; cursor:pointer;
  display:flex; align-items:center; gap:8px; padding:0 18px; min-height:52px;
}
#refresh:active{transform:scale(.97);}
.strength{margin-top:12px; display:flex; align-items:center; gap:10px;}
.strength .bar{flex:1; height:6px; border-radius:3px; background:var(--border); overflow:hidden;}
.strength .bar i{display:block; height:100%; width:0; border-radius:3px; transition:width .25s;}
.strength span{font-size:13px; color:var(--muted); min-width:74px; text-align:right;}
.row{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--border);}
.row:last-child{border-bottom:none;}
.row label{font-size:16px;}
.row .val{font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums;}
input[type=range]{width:100%; accent-color:var(--accent); margin:6px 0 2px;}
.switch{position:relative; width:52px; height:30px; flex:0 0 52px;}
.switch input{opacity:0; width:0; height:0;}
.slider{
  position:absolute; inset:0; border-radius:15px; cursor:pointer;
  background:var(--border); transition:.2s;
}
.slider:before{
  content:""; position:absolute; width:22px; height:22px; border-radius:50%;
  left:4px; top:4px; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + .slider{background:var(--accent);}
.switch input:checked + .slider:before{transform:translateX(22px);}
#gen{
  width:100%; padding:16px; font-size:17px; font-weight:700; border:none; border-radius:14px;
  background:#159a55; color:#fff; cursor:pointer; margin-top:4px; min-height:56px;
}
#gen:active{transform:scale(.98);}
.hint{font-size:13px; color:var(--muted); text-align:center; margin-top:14px; line-height:1.5;}
footer{text-align:center; padding:18px; font-size:13px; color:var(--muted); border-top:1px solid var(--border);}
#toast{
  position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(20px);
  background:var(--text); color:var(--bg); padding:10px 20px; border-radius:24px;
  font-size:14px; opacity:0; pointer-events:none; transition:.25s;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.9 12.1 21 2m-4 2 3 3m-6 0 3 3"/></svg>
  <h1>PassGen</h1>
</header>
<main>
  <div class="card gen-card">
    <h2>🔑 Secure Password Generator</h2>
    <p class="gen-label">Generated Secure Password</p>
    <div class="output-row">
      <div id="pwd" aria-live="polite" title="Tap to copy"></div>
      <button id="refresh" title="Generate a new password">⟳ Refresh</button>
    </div>
    <div class="strength">
      <div class="bar"><i id="sbar"></i></div>
      <span id="slabel">—</span>
    </div>
  </div>

  <div class="card">
    <div class="row" style="display:block; border-bottom:1px solid var(--border);">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label for="len">Length</label>
        <span class="val" id="lenval">16</span>
      </div>
      <input type="range" id="len" min="4" max="64" value="16">
    </div>
    <div class="row"><label>Uppercase (A–Z)</label><span class="switch"><input type="checkbox" id="upper" checked><span class="slider"></span></span></div>
    <div class="row"><label>Lowercase (a–z)</label><span class="switch"><input type="checkbox" id="lower" checked><span class="slider"></span></span></div>
    <div class="row"><label>Numbers (0–9)</label><span class="switch"><input type="checkbox" id="nums" checked><span class="slider"></span></span></div>
    <div class="row"><label>Symbols (#$&amp;…)</label><span class="switch"><input type="checkbox" id="syms" checked><span class="slider"></span></span></div>
  </div>

  <button id="gen">Generate New Password</button>
  <p class="hint">Tap the password to copy it. Generated on your device with cryptographically secure randomness. Nothing is sent anywhere.</p>
</main>
<footer>Made with ❤️ by sauravhhh</footer>
<div id="toast">Copied</div>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
